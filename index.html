<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="地元の人がおすすめする沖縄本島のスポットを地図から見つけるOKINAMAP">
  <title>OKINAMAP</title>
  <link rel="preconnect" href="https://api.maptiler.com">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="app">
    <div id="map" aria-label="金武町周辺のおすすめスポット地図"></div>

    <header class="map-header">
      <a class="brand" href="./" aria-label="OKINAMAP ホーム">
        <img src="assets/logo.svg" alt="OKINAMAP">
      </a>
      <button id="filterOpen" class="round-button filter-button" type="button" aria-label="絞り込みメニューを開く" aria-haspopup="dialog">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
        <span id="filterBadge" class="filter-badge" hidden></span>
      </button>
    </header>

    <div class="map-note" aria-hidden="true">地図のピンをタップ</div>

    <section id="spotSheet" class="spot-sheet" aria-live="polite" aria-hidden="true">
      <button id="sheetClose" class="sheet-close" type="button" aria-label="詳細を閉じる">×</button>
      <div id="photoCarousel" class="photo-carousel"></div>
      <div id="groupSwitcher" class="group-switcher" hidden>
        <button id="groupPrev" type="button" aria-label="前のスポット">‹</button>
        <span id="groupPosition">1 / 1</span>
        <button id="groupNext" type="button" aria-label="次のスポット">›</button>
      </div>
      <div class="spot-content">
        <span id="spotCategory" class="category-label"></span>
        <h1 id="spotName"></h1>
        <p id="spotDescription" class="spot-description"></p>
        <div id="spotNotesWrap" class="notes-wrap" hidden>
          <h2>備考</h2>
          <p id="spotNotes"></p>
        </div>
        <a id="googleMapsLink" class="maps-button" target="_blank" rel="noopener noreferrer">Googleマップで見る</a>
      </div>
    </section>

    <div id="filterModal" class="filter-modal" role="dialog" aria-modal="true" aria-labelledby="filterTitle" hidden>
      <div class="filter-panel">
        <header class="filter-header">
          <div>
            <p class="eyebrow">OKINAMAP</p>
            <h1 id="filterTitle">スポットを絞り込む</h1>
          </div>
          <button id="filterClose" class="plain-close" type="button" aria-label="変更を破棄して閉じる">×</button>
        </header>
        <div id="filterGroups" class="filter-groups"></div>
        <div class="filter-bottom">
          <p id="resultCount" class="result-count" aria-live="polite">該当するスポット：0件</p>
          <p id="zeroMessage" class="zero-message" hidden>この条件に合うスポットはありません。条件を減らしてみてください。</p>
          <button id="clearFilters" class="text-button" type="button">選択をすべて解除</button>
          <button id="applyFilters" class="apply-button" type="button">この条件で表示</button>
        </div>
      </div>
    </div>

    <div id="setupMessage" class="setup-message" hidden>
      <strong>地図の設定が必要です</strong>
      <span><code>config.js</code> にMapTiler APIキーを入力してください。</span>
    </div>
  </main>

  <script src="config.js"></script>
  <script src="data/spots.js"></script>
  <script src="https://unpkg.com/maplibre-gl@5.7.1/dist/maplibre-gl.js"></script>
  <script src="app.js"></script>
</body>
</html>
