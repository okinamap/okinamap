<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff"><title>OKINAMAP</title><link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.7.1/dist/maplibre-gl.css"><link rel="stylesheet" href="styles.css"></head><body>
<div id="splash" class="splash"><img src="assets/logo.svg" alt="OKINAMAP"></div>
<main id="app"><div id="map"></div>
<header class="map-header"><button id="locateButton" class="round-button logo-button" type="button" aria-label="現在地を表示"><img src="assets/logo-symbol.svg" alt=""></button><button id="filterOpen" class="round-button" type="button" aria-label="絞り込み"><svg viewBox="0 0 24 24"><path d="M4 6h16M7 12h10M10 18h4"/></svg><span id="filterBadge" class="filter-badge" hidden></span></button></header>
<section id="spotSheet" class="spot-sheet" aria-hidden="true"><button id="sheetClose" class="sheet-close" aria-label="閉じる">×</button><div id="photoCarousel" class="photo-carousel"></div><div id="groupSwitcher" class="group-switcher" hidden><button id="groupPrev" aria-label="前のスポット">‹</button><span id="groupPosition"></span><button id="groupNext" aria-label="次のスポット">›</button></div><div class="spot-content"><span id="spotCategory" class="category-label"></span><h1 id="spotName"></h1><p id="spotDescription"></p><div id="spotNotesWrap" class="notes-wrap" hidden><h2>備考</h2><p id="spotNotes"></p></div><a id="googleMapsLink" class="maps-button" target="_blank" rel="noopener">Googleマップで見る</a></div></section>
<div id="filterModal" class="filter-modal" role="dialog" aria-modal="true" hidden><div class="filter-panel"><header class="filter-header"><div><small>OKINAMAP</small><h1>スポットを絞り込む</h1></div><button id="filterClose" class="plain-close" aria-label="変更を破棄して閉じる">×</button></header><div id="filterGroups" class="filter-groups"></div><div class="filter-bottom"><p id="resultCount"></p><p id="zeroMessage" hidden>この条件に合うスポットはありません。条件を減らしてみてください。</p><button id="clearFilters" class="text-button">選択をすべて解除</button><button id="applyFilters" class="apply-button">この条件で表示</button></div></div></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div><div id="setupMessage" class="setup-message" hidden><b>config.js にMapTiler APIキーを入力してください。</b></div>
</main><script src="config.js"></script><script src="data/spots.js"></script><script src="https://unpkg.com/maplibre-gl@5.7.1/dist/maplibre-gl.js"></script><script src="app.js"></script></body></html>
